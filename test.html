<!DOCTYPE html>
<html>
<head>
    <title>Test Game Cells</title>
    <style>
        .cell { 
            width: 50px; 
            height: 50px; 
            border: 1px solid black; 
            display: inline-block; 
            cursor: pointer; 
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="cell" data-index="0" onclick="console.log('Cell 0 clicked')">0</div>
    <div class="cell" data-index="1" onclick="console.log('Cell 1 clicked')">1</div>
    <div class="cell" data-index="2" onclick="console.log('Cell 2 clicked')">2</div>
</body>
</html>
